apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone-frontend
  template:
    metadata:
      labels:
        app: capstone-frontend
    spec:
      containers:
      - name: frontend
        image: 892667433222.dkr.ecr.ap-south-1.amazonaws.com/capstone-frontend:latest
        ports:
        - containerPort: 80
